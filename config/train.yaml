seed: 7
epochs: 300
batch_size: 4
num_workers: 4
amp: true
save_dir: experiments

model:
  name: fadv_sr
  args:
    in_channels: 3
    num_frames: 7
    dim: 64
    scale: 4
    heads: 4
    window_size: 8

train_dataset:
  name: paired-video
  args:
    lq_root: /path/to/train/lq
    gt_root: /path/to/train/gt
    num_frames: 7
    scale: 4
    patch_size: 64
    train: true
    samples_per_video: 100
    augment: true

val_dataset:
  name: paired-video
  args:
    lq_root: /path/to/val/lq
    gt_root: /path/to/val/gt
    num_frames: 7
    scale: 4
    patch_size: 64
    train: false
    samples_per_video: 1
    augment: false

optimizer:
  lr: 0.0002
  weight_decay: 0.0001

scheduler:
  milestones: [150, 250]
  gamma: 0.5

loss:
  pixel: 1.0
  wavelet: 0.05
  edge: 0.02
  lpips: 0.0
  grad_clip: 1.0

